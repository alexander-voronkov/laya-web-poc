server {
    server_name laya.voronkov.club;

    root /srv/laya-web-poc/site;
    index index.html;

    # Cross-origin isolation for onnxruntime-web wasm threads (see HF card).
    # These live in the server block on purpose: an `add_header` inside a location
    # REPLACES the inherited set rather than extending it, so any location that adds
    # a header of its own must repeat these two. `expires` does not have that effect,
    # which is why the cache directives below are safe.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;

    # Build artefacts must 404 when absent rather than fall through to the SPA shell.
    # The `try_files ... /index.html` fallback below answers 200 text/html for anything
    # missing, and that is not hypothetical: it is how a missing ORT runtime file
    # passed a status-code check in CI while the model failed to load for every
    # visitor. A 404 is a fact; a 200 full of HTML is a disguise.
    location /assets/ {
        expires 30d;          # Vite content-hashes these filenames, so they are immutable
        try_files $uri =404;
    }

    location /ort/ {
        # Deliberately no long expires here. Unlike /assets/, these filenames are
        # stable across builds (ort-wasm-simd-threaded.{js,wasm}), so a 30-day cached
        # copy would outlive an onnxruntime upgrade and pair a new app with an old
        # runtime.
        try_files $uri =404;
    }

    # Written by the deploy job and compared against the commit SHA. If it is missing,
    # say so instead of handing back the index page for the comparison to puzzle over.
    location = /version.txt {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/laya.voronkov.club/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/laya.voronkov.club/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = laya.voronkov.club) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name laya.voronkov.club;
    return 404; # managed by Certbot


}
